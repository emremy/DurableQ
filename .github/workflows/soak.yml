name: soak

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  soak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
      - run: npm ci
      - run: npm run test:soak
        env:
          DURABLEQ_SOAK_MS: "120000"
