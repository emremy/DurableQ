name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: ["24.15.0", "24.20.0", "26"]
        include:
          - os: macos-latest
            node: "24.20.0"
          - os: windows-latest
            node: "24.20.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:property
      - run: npm run test:model
      - run: npm run test:contract
      - run: npm run test:concurrency
        if: runner.os == 'Linux'
      - run: npm run test:crash
        if: runner.os == 'Linux'
      - run: npm run test:coverage
        if: runner.os == 'Linux'
