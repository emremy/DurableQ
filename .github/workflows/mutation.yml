name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
